<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="welcome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#fbfbfa"/>
  <rect width="640" height="22" fill="#ecebe7"/>
  <circle cx="14" cy="11" r="4" fill="#cfccc5"/><circle cx="28" cy="11" r="4" fill="#cfccc5"/><circle cx="42" cy="11" r="4" fill="#cfccc5"/>
  <rect x="0" y="22" width="320" height="338" fill="url(#welcome)"/>
