name: Windows Store packaging trial
on:
  push:
    branches: ['codex/windows-store-packaging-trial']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appx:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Build unsigned trial AppX (placeholder identity; not for submission)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          npx --no-install electron-builder --win appx --x64 --publish never
          -c.appx.identityName=Techczech.DevTrafficControlPackagingTrial
          -c.appx.publisher=CN=StorePackagingTrial
          -c.appx.publisherDisplayName=PackagingTrial
      - name: Hash trial package
        shell: pwsh
        run: |
          Get-ChildItem -Path release,dist -Filter *.appx -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -FilePath "$($_.DirectoryName)/store-trial-sha256.txt" -Append -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dtc-store-packaging-trial
          path: |
            release/*.appx
            release/store-trial-sha256.txt
            dist/*.appx
            dist/store-trial-sha256.txt
          if-no-files-found: error
