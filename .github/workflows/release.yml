name: Release

# Build the macOS (Apple Silicon) app and upload it to ONE draft GitHub Release.
# Trigger by pushing a version tag, e.g.  git tag v0.22.0 && git push origin v0.22.0
# electron-builder uploads the dmg and zip to a DRAFT release for that version;
# review it, then publish.
#
# The build is code-signed with a Developer ID Application certificate and
# notarised by Apple ("notarize: true" in electron-builder.yml), so downloads
# open without the Gatekeeper warning. The certificate and notarisation
# credentials are encrypted repository secrets (APPLE_DEVID_P12_BASE64,
# APPLE_DEVID_P12_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID). Only tag pushes by a maintainer trigger this; pull requests
# from forks never receive the secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Package + publish (signed + notarised dmg, zip)
        run: npx electron-builder --mac dmg zip --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID code signing: electron-builder imports this .p12 into a temporary keychain
          CSC_LINK: ${{ secrets.APPLE_DEVID_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          # Notarisation
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
